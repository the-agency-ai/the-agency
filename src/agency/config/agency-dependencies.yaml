# Agency Dependencies
#
# These are required to run The Agency framework.
# Checked at: install, update-agency
# All dependencies are REQUIRED.
#
# Format:
#   name: Command name to check
#   min_version: Minimum required version (optional)
#   check: Command to verify installation
#   version_cmd: Command to get version (for version checking)
#   install:
#     darwin: macOS install command
#     linux: Linux install command (apt-based)
#     all: Platform-agnostic install command
#   breaks: What functionality breaks without this

dependencies:
  # Core tools
  - name: git
    min_version: "2.0"
    check: "command -v git"
    version_cmd: "git --version | grep -oE '[0-9]+\\.[0-9]+'"
    install:
      darwin: "xcode-select --install"
      linux: "sudo apt-get install -y git"
    breaks: "version control, all git operations"

  - name: curl
    check: "command -v curl"
    install:
      darwin: "brew install curl"
      linux: "sudo apt-get install -y curl"
    breaks: "fetching resources, API calls"

  - name: jq
    min_version: "1.6"
    check: "command -v jq"
    version_cmd: "jq --version | grep -oE '[0-9]+\\.[0-9]+'"
    install:
      darwin: "brew install jq"
      linux: "sudo apt-get install -y jq"
    breaks: "JSON processing in tools"

  # Claude Code
  - name: claude
    check: "command -v claude"
    install:
      all: "curl -fsSL https://claude.ai/install.sh | sh"
    breaks: "Claude Code CLI - core functionality"

  # Python runtime (framework floor 3.13 per D45-R1; supersedes D44 3.12)
  # Shebang convention: `#!/usr/bin/env python3` + runtime sys.version_info
  # guard. Briefing: usr/jordan/captain/briefings/python-shebang-investigation-20260418.md
  - name: python3
    min_version: "3.13"
    check: "command -v python3"
    # Highest python on PATH among python3 / python3.1x (Linux keeps the distro
    # python3 and adds python3.13 next to it).
    version_cmd: "for p in python3 python3.13 python3.14 python3.15; do command -v $p >/dev/null 2>&1 && $p -c 'import sys; print(\"%d.%d\" % sys.version_info[:2])'; done | sort -t. -k1,1n -k2,2n | tail -1"
    install:
      # `brew install python` (unversioned) creates the `python3` symlink
      # that our `python3` shebang relies on. `brew install python@3.13` is
      # the versioned-keg alternative — installs 3.13 but does NOT create
      # the unversioned `python3` symlink, so `python3` on PATH stays at
      # Apple stock (3.9 on macOS 14) and the framework's runtime guard
      # fires. Do NOT use `python@3.13` here — it reproduces the Monitor
      # 127 incident this PR exists to fix (see
      # usr/jordan/captain/briefings/python-shebang-investigation-20260418.md).
      darwin: "brew install python"
      # Linux/WSL: install python3.13 BESIDE the distro python3. Never repoint
      # /usr/bin/python3 (update-alternatives) — apt and other system tools are
      # built against the distro version and break. Framework Python tools
      # re-exec under python3.13 on their own.
      linux: "if command -v uv >/dev/null 2>&1; then uv python install 3.13; else sudo add-apt-repository -y ppa:deadsnakes/ppa && sudo apt-get update && sudo apt-get install -y python3.13; fi"
    breaks: "hooks (stop-check, plan-capture), dispatch-monitor, iscp dispatch-hub service, captain tools"

  # ISCP database (dispatches, flags). Floor 3.38: Ubuntu 22.04 ships 3.37.2,
  # so on Linux the install goes through `agency deps install`, which builds a
  # current sqlite3 into ~/.local/bin when the distro package is too old.
  - name: sqlite3
    min_version: "3.38"
    check: "command -v sqlite3"
    version_cmd: "sqlite3 --version | grep -oE '^[0-9]+\\.[0-9]+'"
    install:
      darwin: "brew install sqlite"
      linux: "./agency/tools/agency deps install required"
    breaks: "ISCP — dispatch, flag, iscp-check, session-pickup"

  # JavaScript runtime
  - name: bun
    min_version: "1.0"
    check: "command -v bun"
    version_cmd: "bun --version | grep -oE '[0-9]+\\.[0-9]+'"
    install:
      all: "curl -fsSL https://bun.sh/install | bash"
    breaks: "agency-service, all embedded services"

  - name: node
    min_version: "18.0"
    check: "command -v node"
    version_cmd: "node --version | grep -oE '[0-9]+\\.[0-9]+'"
    install:
      darwin: "brew install node"
      linux: "curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs"
    breaks: "AgencyBench build, npm packages"

  # GitHub CLI
  - name: gh
    min_version: "2.0"
    check: "command -v gh"
    version_cmd: "gh --version | head -1 | grep -oE '[0-9]+\\.[0-9]+'"
    install:
      darwin: "brew install gh"
      linux: "sudo apt-get install -y gh"
    breaks: "GitHub PRs, releases, issue management"

  # File utilities
  - name: tree
    check: "command -v tree"
    install:
      darwin: "brew install tree"
      linux: "sudo apt-get install -y tree"
    breaks: "directory visualization"

  - name: rsync
    check: "command -v rsync"
    install:
      darwin: "brew install rsync"
      linux: "sudo apt-get install -y rsync"
    breaks: "file syncing, starter releases"

  # YAML/JSON processing
  - name: yq
    min_version: "4.0"
    check: "command -v yq"
    version_cmd: "yq --version | grep -oE '[0-9]+\\.[0-9]+'"
    install:
      darwin: "brew install yq"
      linux: "sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq"
    breaks: "YAML processing in tools"

  # Enhanced CLI tools
  - name: fzf
    check: "command -v fzf"
    install:
      darwin: "brew install fzf"
      linux: "sudo apt-get install -y fzf"
    breaks: "fuzzy finder in interactive tools"

  - name: bat
    check: "command -v bat"
    install:
      darwin: "brew install bat"
      linux: "sudo apt-get install -y bat"
    breaks: "syntax-highlighted file viewing"

  - name: rg
    check: "command -v rg"
    install:
      darwin: "brew install ripgrep"
      linux: "sudo apt-get install -y ripgrep"
    breaks: "fast code search"

  # PDF processing
  - name: pdftotext
    check: "command -v pdftotext"
    install:
      darwin: "brew install poppler"
      linux: "sudo apt-get install -y poppler-utils"
    breaks: "PDF reading in Claude Code (Read tool)"

  # Rust (for Tauri/AgencyBench builds)
  - name: cargo
    min_version: "1.70"
    check: "command -v cargo"
    version_cmd: "cargo --version | grep -oE '[0-9]+\\.[0-9]+'"
    install:
      all: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
    breaks: "AgencyBench (Tauri) builds"
